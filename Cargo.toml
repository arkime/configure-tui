[package]
name = "arkime-setup"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI to configure an Arkime installation (native or docker)"
license = "Apache-2.0"

# The installed binary replaces the old bash `Configure` script, so name it that
# when packaging. During development the crate/bin is `arkime-setup`.
[[bin]]
name = "arkime-setup"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-input = "0.11"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
