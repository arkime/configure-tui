name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked
      - name: Build static binary
        run: cross build --release --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          bin="target/${{ matrix.target }}/release/arkime-setup"
          out="arkime-setup-${{ matrix.arch }}"
          cp "$bin" "$out"
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: arkime-setup-${{ matrix.arch }}
          path: |
            arkime-setup-${{ matrix.arch }}
            arkime-setup-${{ matrix.arch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            arkime-setup-x86_64
            arkime-setup-x86_64.sha256
            arkime-setup-aarch64
            arkime-setup-aarch64.sha256
