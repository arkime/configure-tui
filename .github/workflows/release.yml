name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Build a static per-arch binary and attach it to the GitHub release.
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - name: macos-arm64
            runs-on: macos-14
            target: aarch64-apple-darwin
            musl: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Version from tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        env:
          # Native musl builds need the musl linker (musl-tools provides it).
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/Configure-tui"
          out="Configure-tui-${{ matrix.name }}"
          cp "$bin" "$out"
          shasum -a 256 "$out" > "$out.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            Configure-tui-${{ matrix.name }}
            Configure-tui-${{ matrix.name }}.sha256

  # Build & push per-arch container images to ghcr (plain docker, no marketplace
  # actions beyond the pinned checkout).
  docker:
    name: docker-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Version from tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & push arch image
        run: |
          img="ghcr.io/${{ github.repository_owner }}/configure-tui"
          docker build -t "${img}:${RELEASE_VERSION}-${{ matrix.arch }}" .
          docker push "${img}:${RELEASE_VERSION}-${{ matrix.arch }}"

  # Combine the arch images into multi-arch :version and :latest manifests.
  docker-manifest:
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Version from tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push manifests
        run: |
          img="ghcr.io/${{ github.repository_owner }}/configure-tui"
          for tag in "${RELEASE_VERSION}" latest; do
            docker manifest create "${img}:${tag}" \
              "${img}:${RELEASE_VERSION}-amd64" \
              "${img}:${RELEASE_VERSION}-arm64"
            docker manifest push "${img}:${tag}"
          done
